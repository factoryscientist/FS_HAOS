## XIAO ESP32S3 Sense — 音量による異常検知（カメラなし）
esphome:
  name: xiaos3-sound
  friendly_name: 騒音センサー

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: xjnNgMaVG15XvNcs4EvZgCX2gBSSlm6rOo4NOvVZ6tQ=
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


captive_portal:

# --- I2S（XIAO ESP32S3 Sense の内蔵PDMマイク）---
i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO42

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_in
    adc_type: external
    pdm: true
    i2s_din_pin: GPIO41
    sample_rate: 16000
    bits_per_sample: 32bit

sensor:
  # --- 音量測定 ---
  - platform: sound_level
    microphone:
      microphone: mic
    passive: false
    measurement_duration: 1000ms
    rms:
      name: "RMS 音量（平均）"
      id: sound_rms
      unit_of_measurement: "dB"
      accuracy_decimals: 1
      filters:
        # 直近10秒の移動平均。瞬間的なノイズを均す
        - sliding_window_moving_average:
            window_size: 10
            send_every: 5
    peak:
      name: "Peak 音量（ピーク）"
      id: sound_peak
      unit_of_measurement: "dB"
      accuracy_decimals: 1

  # --- 平常時の基準値（直近10分の平均）---
  - platform: copy
    source_id: sound_rms
    name: "Baseline 平常時の音量"
    id: sound_baseline
    unit_of_measurement: "dB"
    accuracy_decimals: 1
    filters:
      - sliding_window_moving_average:
          window_size: 600
          send_every: 60

  # --- 基準値からの乖離＝異常度 ---
  - platform: template
    name: "Deviation 平常時との差"
    id: sound_deviation
    unit_of_measurement: "dB"
    accuracy_decimals: 1
    lambda: |-
      if (isnan(id(sound_rms).state) || isnan(id(sound_baseline).state)) {
        return NAN;
      }
      return id(sound_rms).state - id(sound_baseline).state;
    update_interval: 5s

  # --- WiFi電波強度（接続確認用）---
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

binary_sensor:
  # --- 異常判定：平常時より6dB以上大きい状態が続いたら ---
  - platform: template
    name: "Alert 音の異常"
    id: sound_anomaly
    device_class: problem
    lambda: |-
      if (isnan(id(sound_deviation).state)) return false;
      return id(sound_deviation).state > 6.0;
    filters:
      # 一瞬の物音では反応させない（10秒続いたら異常）
      - delayed_on: 10s
      - delayed_off: 30s

  # --- 静かすぎる＝停止している可能性 ---
  - platform: template
    name: "Stopped 動作停止の疑い"
    id: sound_stopped
    device_class: problem
    lambda: |-
      if (isnan(id(sound_deviation).state)) return false;
      return id(sound_deviation).state < -10.0;
    filters:
      - delayed_on: 60s
      - delayed_off: 30s
