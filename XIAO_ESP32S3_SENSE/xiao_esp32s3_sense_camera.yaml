esphome:
  name: esp32s3-sense
  friendly_name: esp32s3-sense

  platformio_options:
    build_flags: -DBOARD_HAS_PSRAM
    board_build.arduino.memory_type: qio_opi
    board_build.f_flash: 80000000L
    board_build.flash_mode: qio

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# PSRAM
psram:
  mode: octal
  speed: 80MHz

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Wi-Fi接続に失敗した場合のアクセスポイント
  ap:
    ssid: "Esp32S3-Sense Fallback Hotspot"
    password: "VPAXzblWUU5m"

captive_portal:

# ESP32-S3 Sense Camera
esp32_camera:
  id: espcam
  name: "My Camera"

  external_clock:
    pin: GPIO10
    frequency: 20MHz

  i2c_pins:
    sda: GPIO40
    scl: GPIO39

  data_pins:
    - GPIO15
    - GPIO17
    - GPIO18
    - GPIO16
    - GPIO14
    - GPIO12
    - GPIO11
    - GPIO48

  vsync_pin: GPIO38
  href_pin: GPIO47
  pixel_clock_pin: GPIO13

  resolution: 800x600

# Camera Web Server
esp32_camera_web_server:
  - port: 8080
    mode: stream

  - port: 8081
    mode: snapshot
